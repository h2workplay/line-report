<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>写真報告</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --ink: #1d2b33;
    --sub: #5b6b74;
    --line: #cfd9de;
    --bg: #f3f6f7;
    --card: #ffffff;
    --accent: #0d6a86;
    --accent-soft: #e2f0f4;
    --ok: #2b8a4b;
    --ng: #c23b2f;
    --warn-bg: #fff4e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    font-size: 17px; line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  header { padding: 6px 2px 14px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  header p { margin: 4px 0 0; color: var(--sub); font-size: 14px; }
  .mode-report header h1 { color: #8a3b12; }

  .field { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .field > .label { display: block; font-size: 14px; color: var(--sub); margin-bottom: 6px; }
  .ro { font-size: 18px; font-weight: 600; }
  input[type=date], input[type=text], textarea {
    width: 100%; font-size: 17px; font-family: inherit; color: var(--ink);
    padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 110px; }

  /* 物件名 */
  .chosen { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); border: 1.5px solid var(--accent); }
  .chosen b { flex: 1; font-size: 18px; }
  .chosen button { border: 0; background: none; color: var(--accent); font-size: 15px; padding: 6px; text-decoration: underline; }
  .recent { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .recent .cap { width: 100%; font-size: 13px; color: var(--sub); }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 15px; color: var(--ink); }
  .cands { list-style: none; margin: 8px 0 0; padding: 0; max-height: 330px; overflow-y: auto; border-radius: 9px; }
  .cands li button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 12px 10px; font-size: 17px; color: var(--ink); }
  .cands li button small { display: block; color: var(--sub); font-size: 13px; }
  .cands li.free button { color: var(--accent); }
  .hint { font-size: 13px; color: var(--sub); margin-top: 6px; }

  /* 写真 */
  .pick { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border: 2px dashed var(--accent); border-radius: 10px; color: var(--accent); font-weight: 600; background: #fff; font-size: 17px; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #dde5e8; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .x { position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 26px; padding: 0; }
  .thumb .st { position: absolute; inset: auto 0 0 0; text-align: center; font-size: 13px; font-weight: 700; color: #fff; padding: 2px 0; }
  .thumb.ok .st { background: var(--ok); }
  .thumb.ng .st { background: var(--ng); }
  .thumb.sending .st { background: var(--accent); }
  .count { font-size: 14px; color: var(--sub); margin-top: 6px; }

  .urgent { display: flex; align-items: center; gap: 10px; font-size: 17px; }
  .urgent input { width: 24px; height: 24px; accent-color: var(--ng); }

  .submit { display: block; width: 100%; border: 0; border-radius: 12px; padding: 16px; font-size: 19px; font-weight: 700; color: #fff; background: var(--accent); margin-top: 6px; }
  .submit:disabled { opacity: .5; }
  .mode-report .submit { background: #b4531c; }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 15px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: #fdecea; color: var(--ng); }
  .msg.info { background: var(--accent-soft); color: var(--ink); }
  .retry { display: none; width: 100%; margin-top: 10px; padding: 14px; border-radius: 12px; border: 2px solid var(--ng); background: #fff; color: var(--ng); font-size: 17px; font-weight: 700; }

  .done { text-align: center; padding: 40px 10px; }
  .done .mark { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 42px; line-height: 72px; margin: 0 auto 16px; }
  .done h2 { margin: 0 0 8px; font-size: 22px; }
  .done p { margin: 4px 0; font-size: 17px; }
  .done .btns { display: grid; gap: 10px; margin-top: 26px; }
  .done .btns button { padding: 14px; border-radius: 12px; font-size: 17px; font-weight: 600; border: 1.5px solid var(--accent); background: #fff; color: var(--accent); }
  .done .btns button.primary { background: var(--accent); color: #fff; }
  .loading { text-align: center; padding: 80px 10px; color: var(--sub); }
  [hidden] { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main id="app">
  <div class="loading" id="loading">読み込み中…</div>

  <div id="form" hidden>
    <header>
      <h1 id="title">写真報告</h1>
      <p id="lead">作業日・物件名・写真をまとめて送ります</p>
    </header>

    <div class="field">
      <span class="label">報告者</span>
      <div class="ro" id="reporter"></div>
    </div>

    <div class="field">
      <label class="label" for="date" id="dateLabel">作業日</label>
      <input type="date" id="date">
    </div>

    <div class="field">
      <label class="label" for="propInput">物件名</label>
      <div class="chosen" id="chosen" hidden>
        <b id="chosenName"></b>
        <button type="button" id="changeProp">変更</button>
      </div>
      <div id="propSearch">
        <input type="text" id="propInput" placeholder="例:こーぽご、江州、3" autocomplete="off" enterkeyhint="search">
        <div class="hint">物件名の一部やよみがなを入れると候補が出ます</div>
        <ul class="cands" id="cands"></ul>
        <div class="recent" id="recent"></div>
      </div>
    </div>

    <div class="field" id="contentField" hidden>
      <label class="label" for="content">内容</label>
      <textarea id="content" placeholder="例:エントランスの自動ドアが閉まらない"></textarea>
    </div>

    <div class="field">
      <span class="label" id="photoLabel">写真</span>
      <label class="pick">
        <span>＋ 写真を選ぶ(まとめて選べます)</span>
        <input type="file" id="files" accept="image/*" multiple hidden>
      </label>
      <div class="thumbs" id="thumbs"></div>
      <div class="count" id="count"></div>
    </div>

    <div class="field" id="urgentField" hidden>
      <label class="urgent"><input type="checkbox" id="urgent"> 至急(管理者にすぐ通知)</label>
    </div>

    <button type="button" class="submit" id="submit">まとめて送信</button>
    <div class="msg" id="msg"></div>
    <button type="button" class="retry" id="retry">送れなかった写真を送り直す</button>
  </div>

  <div class="done" id="done" hidden>
    <div class="mark">✓</div>
    <h2 id="doneTitle">保存しました</h2>
    <p id="doneProp"></p>
    <p id="doneCount"></p>
    <div class="btns">
      <button type="button" class="primary" id="again">続けて別の物件を報告する</button>
      <button type="button" id="close">閉じる</button>
    </div>
  </div>
</main>

<script>
/* ============ 設定(ここだけ書き換えてください) ============ */
const LIFF_ID = 'ここにLIFF_IDを貼り付け';          // LINE Developers の LIFF タブにある「LIFF ID」
const GAS_URL = 'ここにApps_ScriptのURLを貼り付け';  // Apps Script のウェブアプリURL(…/exec で終わるもの。?key= は付けない)
/* ======================================================== */

const MAX_SIDE = 1600;      // 写真の長い辺をこのピクセル数まで縮小
const JPEG_QUALITY = 0.82;

const $ = (id) => document.getElementById(id);
const isReport = new URLSearchParams(location.search).get('type') === 'genba';
let properties = [];   // {n: 物件名, y: よみがな, k: 検索用}
let recent = [];
let chosen = '';
let photos = [];       // {data: dataURL, status: 'wait'|'sending'|'ok'|'ng'}
let batchId = '';
let busy = false;

/* ---------- 文字の正規化(カタカナ→ひらがな、全角→半角、Ⅲ→3 など) ---------- */
function norm(s) {
  return String(s || '')
    .replace(/[\u2160-\u216B]/g, (c) => String(c.charCodeAt(0) - 0x2160 + 1))
    .replace(/[\u2170-\u217B]/g, (c) => String(c.charCodeAt(0) - 0x2170 + 1))
    .normalize('NFKC').toLowerCase()
    .replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[-‐−–—―]/g, 'ー')
    .replace(/[\s・.,'’"()（）]/g, '');
}

/* ---------- 起動 ---------- */
async function start() {
  if (isReport) {
    document.body.classList.add('mode-report');
    document.title = '現場報告';
    $('title').textContent = '現場報告';
    $('lead').textContent = '設備の故障など、清掃以外の問題を報告します';
    $('dateLabel').textContent = '発生日';
    $('photoLabel').textContent = '写真(あれば)';
    $('contentField').hidden = false;
    $('urgentField').hidden = false;
    $('submit').textContent = '報告を送信';
  }
  $('date').value = today();
  try {
    await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const res = await call({ action: 'init' });
    $('reporter').textContent = res.name;
    recent = res.recent || [];
    properties = (res.properties || []).map((p) => ({ n: p.n, y: p.y, k: norm(p.n) + '|' + norm(p.y) }));
    renderCands();
    $('loading').hidden = true;
    $('form').hidden = false;
  } catch (err) {
    $('loading').textContent = '開けませんでした:' + err.message + '\nいったん閉じて、もう一度開いてください。';
    $('loading').style.whiteSpace = 'pre-line';
  }
}

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function call(payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ kind: 'liff', accessToken: liff.getAccessToken() }, payload)),
  });
  let json;
  try { json = await res.json(); } catch (e) { throw new Error('サーバーから正しい返事がありませんでした'); }
  if (!json.ok) throw new Error(json.error || '送信エラー');
  return json;
}

/* ---------- 物件名の候補 ---------- */
function renderCands() {
  const q = norm($('propInput').value);
  const ul = $('cands');
  ul.innerHTML = '';
  const rec = $('recent');
  rec.innerHTML = '';

  if (!q) {
    const list = recent.filter((n) => n);
    if (list.length) {
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = '最近報告した物件';
      rec.appendChild(cap);
      list.forEach((n) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.textContent = n;
        b.onclick = () => choose(n);
        rec.appendChild(b);
      });
    }
    return;
  }
  const hits = [];
  properties.forEach((p, i) => {
    const pos = p.k.indexOf(q);
    if (pos < 0) return;
    const head = norm(p.n).indexOf(q) === 0 || norm(p.y).indexOf(q) === 0;
    const score = (recent.indexOf(p.n) >= 0 ? 0 : 2) + (head ? 0 : 1);
    hits.push({ p, score, i });
  });
  hits.sort((a, b) => a.score - b.score || a.i - b.i);
  hits.slice(0, 40).forEach(({ p }) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = p.n;
    if (p.y) { const s = document.createElement('small'); s.textContent = p.y; b.appendChild(s); }
    b.onclick = () => choose(p.n);
    li.appendChild(b);
    ul.appendChild(li);
  });
  const raw = $('propInput').value.trim();
  const li = document.createElement('li');
  li.className = 'free';
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = (hits.length ? '' : '一致する物件がありません。') + '「' + raw + '」をリストにない物件として使う';
  b.onclick = () => choose(raw);
  li.appendChild(b);
  ul.appendChild(li);
}

function choose(name) {
  name = String(name || '').trim();
  if (!name) return;
  chosen = name;
  $('chosenName').textContent = name;
  $('chosen').hidden = false;
  $('propSearch').hidden = true;
  $('propInput').blur();
}

$('changeProp').onclick = () => {
  if (busy) return;
  chosen = '';
  $('chosen').hidden = true;
  $('propSearch').hidden = false;
  $('propInput').value = '';
  renderCands();
  $('propInput').focus();
};
['input', 'compositionupdate', 'keyup'].forEach((ev) => $('propInput').addEventListener(ev, renderCands));

/* ---------- 写真 ---------- */
$('files').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (!files.length) return;
  showMsg('info', '写真を準備しています…');
  for (const f of files) {
    try {
      photos.push({ data: await shrink(f), status: 'wait' });
      renderThumbs();
    } catch (err) {
      showMsg('err', '読み込めない写真がありました(' + f.name + ')');
    }
  }
  if ($('msg').classList.contains('info')) hideMsg();
});

function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const r = Math.min(1, MAX_SIDE / Math.max(w, h));
      w = Math.round(w * r); h = Math.round(h * r);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', JPEG_QUALITY));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めません')); };
    img.src = url;
  });
}

function renderThumbs() {
  const box = $('thumbs');
  box.innerHTML = '';
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb ' + p.status;
    const im = document.createElement('img');
    im.src = p.data; im.alt = '写真' + (i + 1);
    d.appendChild(im);
    if (p.status === 'wait' && !busy) {
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', '写真' + (i + 1) + 'を外す');
      x.onclick = () => { photos.splice(i, 1); renderThumbs(); };
      d.appendChild(x);
    }
    const label = { ok: '✓ 送信済', ng: '✕ 失敗', sending: '送信中' }[p.status];
    if (label) { const s = document.createElement('div'); s.className = 'st'; s.textContent = label; d.appendChild(s); }
    box.appendChild(d);
  });
  $('count').textContent = photos.length ? photos.length + '枚選択中' : '';
}

/* ---------- 送信 ---------- */
$('submit').onclick = () => send();
$('retry').onclick = () => send();

async function send() {
  if (busy) return;
  hideMsg();
  const date = $('date').value;
  const content = $('content').value.trim();
  if (!date) return showMsg('err', '日付を選んでください');
  if (!chosen) return showMsg('err', '物件名を選んでください');
  if (isReport && !content) return showMsg('err', '内容を書いてください');
  if (!isReport && !photos.length) return showMsg('err', '写真を選んでください');

  if (!batchId) batchId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  setBusy(true);
  $('retry').style.display = 'none';

  // 写真を1枚ずつ送る(どの写真にも作業日と物件名が付いている)
  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    if (p.status === 'ok') continue;
    p.status = 'sending'; renderThumbs();
    showMsg('info', '送信中… ' + (i + 1) + ' / ' + photos.length + '枚');
    let ok = false;
    for (let t = 0; t < 2 && !ok; t++) {
      try {
        await call({ action: 'photo', mode: isReport ? 'report' : 'photo', batchId, index: i,
          date, property: chosen, content, image: p.data });
        ok = true;
      } catch (err) {
        p.error = err.message;
      }
    }
    p.status = ok ? 'ok' : 'ng';
    renderThumbs();
  }

  const failed = photos.filter((p) => p.status !== 'ok');
  if (failed.length) {
    setBusy(false);
    showMsg('err', failed.length + '枚送れませんでした(' + (failed[0].error || '') + ')。\n電波の良い場所で「送り直す」を押してください。送れた写真はそのまま保存されています。');
    $('retry').style.display = 'block';
    return;
  }

  if (isReport) {
    try {
      await call({ action: 'report', batchId, date, property: chosen, content,
        urgent: $('urgent').checked, photoCount: photos.length });
    } catch (err) {
      setBusy(false);
      showMsg('err', '報告を記録できませんでした(' + err.message + ')。「送り直す」を押してください。');
      $('retry').style.display = 'block';
      return;
    }
  }

  // トークに完了の文を流す(ボットが保存結果を返信します)
  const md = Number(date.slice(5, 7)) + '/' + Number(date.slice(8, 10));
  const text = isReport
    ? '現場報告を送信しました(' + md + ' ' + chosen + ')'
    : '写真報告を送信しました(' + md + ' ' + chosen + ' ' + photos.length + '枚)';
  try {
    if (liff.isInClient()) await liff.sendMessages([{ type: 'text', text }]);
  } catch (e) { /* トークの外から開いた場合などは送れないが、保存は完了している */ }

  setBusy(false);
  $('form').hidden = true;
  $('done').hidden = false;
  $('doneTitle').textContent = isReport ? '報告を送信しました' : '保存しました';
  $('doneProp').textContent = Number(date.slice(5, 7)) + '月' + Number(date.slice(8, 10)) + '日 ' + chosen;
  $('doneCount').textContent = photos.length ? '写真 ' + photos.length + '枚' : '';
  window.scrollTo(0, 0);
}

function setBusy(v) {
  busy = v;
  $('submit').disabled = v;
  $('date').disabled = v;
  $('files').disabled = v;
  $('changeProp').disabled = v;
  renderThumbs();
}

function showMsg(type, text) {
  const m = $('msg');
  m.className = 'msg show ' + type;
  m.textContent = text;
  m.style.whiteSpace = 'pre-line';
}
function hideMsg() { $('msg').className = 'msg'; }

$('again').onclick = () => {
  photos = []; batchId = ''; chosen = '';
  $('content').value = ''; $('urgent').checked = false;
  $('chosen').hidden = true; $('propSearch').hidden = false; $('propInput').value = '';
  renderThumbs(); renderCands(); hideMsg();
  $('retry').style.display = 'none';
  $('done').hidden = true; $('form').hidden = false;
};
$('close').onclick = () => { if (liff.isInClient()) liff.closeWindow(); else window.close(); };

start();
</script>
</body>
</html>
